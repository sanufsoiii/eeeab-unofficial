modLoader = "javafml"
loaderVersion = "[4,)"
license = "LGPL-3.0"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "EEEAB's Mobs (Unofficial Architectury Port)"
displayURL = "https://www.curseforge.com/minecraft/mc-mods/eeeabs-mobs"
logoFile = "banner.png"
authors = "EEEAB (original author)"
credits = "Original mod by EEEAB. This is an unofficial port and is not endorsed by the original author."
description = '''EEEAB's Mobs adds a variety of new mobs, bosses, items and structures.

Unofficial port of EEEAB's Mobs to Architectury API.'''

[[mixins]]
config = "eeeabsmobs.mixins.json"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neo_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "[${minecraft_version},1.22)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "architectury"
type = "required"
versionRange = "[18.0.8,)"
ordering = "AFTER"
side = "BOTH"
