plugins {
	id 'architectury-plugin'
	id 'net.neoforged.moddev'
}

evaluationDependsOn(':common')

group = project.maven_group
version = "${project.minecraft_version}-${project.mod_version}"

repositories {
	mavenCentral()
	maven { url = 'https://www.cursemaven.com' }
	maven { url = 'https://maven.blamejared.com' }
	maven { url = 'https://maven.architectury.dev/' }
	maven { url = 'https://maven.neoforged.net/releases/' }
}

neoForge {
	version = project.neo_version

	runs {
		client {
			client()
			jvmArguments.addAll '-Dmixin.debug=true', '-Dmixin.debug.verbose=true'
		}
		server {
			server()
			programArguments.addAll '--nogui'
			gameDirectory = project.file('run-server')
			jvmArguments.addAll '-Dmixin.debug=true', '-Dmixin.debug.verbose=true'
		}
	}

	mods {
		"${project.mod_id}" {
			sourceSet sourceSets.main
		}
	}
}

dependencies {
	implementation files(
			project(':common').tasks.named('transformProductionNeoForge').flatMap { it.archiveFile }
	)
	implementation "dev.architectury:architectury-neoforge:${project.architectury_api_version}"
	compileOnly "com.google.code.findbugs:jsr305:3.0.2"
}

def explodedCommon = layout.buildDirectory.dir('explodedCommon')

def explodeCommon = tasks.register('explodeCommon', Copy) {
	duplicatesStrategy = DuplicatesStrategy.INCLUDE
	dependsOn ':common:transformProductionNeoForge'
	from { zipTree(project(':common').tasks.named('transformProductionNeoForge').get().archiveFile) }
	into explodedCommon
}

sourceSets.main.output.dir(explodedCommon, builtBy: explodeCommon)

processResources {
	from(project(':common').file('src/main/resources/eeeabsmobs.accesswidener'))
	from(project(':common').file('src/main/resources/eeeabsmobs.mixins.json'))
	from(rootProject.file('LICENSE.txt')) { rename { "${it}_${project.mod_id}" } }
}

tasks.named('processResources', ProcessResources).configure {
	def expandProps = [
			mod_id             : project.mod_id,
			mod_name           : project.mod_name,
			mod_version        : project.mod_version,
			mod_license        : project.mod_license,
			mod_authors        : project.mod_authors,
			maven_group        : project.maven_group,
			minecraft_version  : project.minecraft_version,
			neo_version        : project.neo_version,
	]
	inputs.properties(expandProps)
	filesMatching(['META-INF/neoforge.mods.toml']) { expand expandProps }
}

tasks.register('distJar', Jar) {
	group = 'build'
	description = 'Assembles the distributable NeoForge jar (common + neoforge module).'

	archiveClassifier = 'neoforge'
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE

	from({
		zipTree(project(':common').tasks.named('transformProductionNeoForge').get().archiveFile.get().asFile)
	})
	from(sourceSets.main.output)

	manifest {
		attributes(
				'Implementation-Title': project.mod_name,
				'Implementation-Version': project.mod_version,
				'Implementation-Vendor': project.mod_authors
		)
	}
}

tasks.named('assemble') {
	dependsOn 'distJar'
}

tasks.register('checkNeoForgeArtifact') {
	dependsOn 'distJar'
	doLast {
		def jarFile = tasks.named('distJar', Jar).get().archiveFile.get().asFile
		if (!jarFile.exists()) {
			throw new GradleException("Distributable NeoForge jar was not produced: ${jarFile}")
		}
	}
}

tasks.named('build') {
	dependsOn 'checkNeoForgeArtifact'
}

tasks.withType(Jar).configureEach {
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
