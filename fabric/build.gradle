plugins {
	id 'architectury-plugin'
	id 'dev.architectury.loom'
}

evaluationDependsOn(':common')

version = "${project.minecraft_version}-${project.mod_version}"
group = project.maven_group

architectury {
	platformSetupLoomIde()
	fabric()
}

loom {
	accessWidenerPath = project(':common').file('src/main/resources/eeeabsmobs.accesswidener')

	mods {
		"${project.mod_id}" {
			sourceSet sourceSets.main
		}
	}
}

processResources {
	from(rootProject.file('LICENSE.txt')) { rename { "${it}_${project.mod_id}" } }
}

tasks.named('processResources') {
	def props = [
			version            : project.version,
			mod_version        : project.mod_version,
			mod_id             : project.mod_id,
			mod_name           : project.mod_name,
			mod_license        : project.mod_license,
			mod_authors        : project.mod_authors,
			minecraft_version  : project.minecraft_version,
			loader_version     : project.loader_version,
	]
	inputs.properties props
	filesMatching('fabric.mod.json') { expand props }
}

['runClient', 'runServer'].each { runTask ->
	tasks.named(runTask) {
		it.jvmArgs '-Dmixin.debug=true', '-Dmixin.debug.verbose=true'
	}
}

sourceSets.main.resources.srcDir project(':common').file('src/main/resources')

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	modImplementation "dev.architectury:architectury-fabric:${project.architectury_api_version}"
	compileOnly project(':common')
	modImplementation project(':common')

	compileOnly "com.google.code.findbugs:jsr305:3.0.2"
	compileOnly "com.google.code.gson:gson:2.10.1"
}

tasks.withType(Jar).configureEach {
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.register('distJar', Jar) {
	group = 'build'
	description = 'Assembles the distributable Fabric jar (common + fabric module).'

	archiveClassifier = 'fabric'
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE

	dependsOn ':common:remapJar'
	dependsOn ':fabric:remapJar'

	from({
		zipTree(tasks.named('remapJar').get().archiveFile.get().asFile)
	})

	from({
		zipTree(project(':common').tasks.named('remapJar').get().archiveFile.get().asFile)
	}) {
		exclude 'eeeabsmobs.accesswidener'
	}

	manifest {
		attributes(
				'Implementation-Title': project.mod_name,
				'Implementation-Version': project.mod_version,
				'Implementation-Vendor': project.mod_authors
		)
	}
}

tasks.named('assemble') {
	dependsOn 'distJar'
}

tasks.register('checkFabricArtifact') {
	dependsOn 'distJar'
	doLast {
		def jarFile = tasks.named('distJar', Jar).get().archiveFile.get().asFile
		if (!jarFile.exists()) {
			throw new GradleException("Distributable Fabric jar was not produced: ${jarFile}")
		}
	}
}

tasks.named('build') {
	dependsOn 'checkFabricArtifact'
}
